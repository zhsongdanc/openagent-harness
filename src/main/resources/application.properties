# mysql,memory
store.engine=MYSQL
project.workspace=/Users/demus/IdeaProjects/openagent-harness

# model context window size (tokens)
model.context.window=64000

# compaction: single threshold (ratio of context window)
# When exceeded: first try L0 rule-based compression, then escalate to L1 LLM summary if still over threshold
compaction.threshold=0.7

# compaction: keep recent N messages untouched
compaction.keep.recent=6

# compaction: tool result max chars before truncation (L0 step compactor)
# Note: tool results are now stored in files, context only holds references.
# This config still applies to StepCompactor for any remaining inline content.
compaction.tool.result.max.chars=2000

# tool result storage: results are stored under {project.workspace}/.agent-data/tool-results/{sessionId}/
# model accesses results via read_tool_result tool with offset/limit pagination