# store engine: MYSQL(落库) / MEMORY(进程内非持久) / FILE(Codex 风格 JSONL rollout)
# 作为独立 CLI 工具默认用 FILE：免外部依赖、支持 /session 恢复与 /replay 回放；
# 如需落库改回 MYSQL 并配好 db.properties。
store.engine=FILE
# 工作区根目录：留空则默认取 JVM 启动目录（user.dir），即“在哪个目录敲命令就把哪当工作区”。
# 临时指定可用启动参数 -Dproject.workspace=/path/to/repo 覆盖，无需改此文件。
#project.workspace=

# ---- 分层指令记忆（AGENTS.md 加载器，借鉴 Codex/Claude Code）----
# 装配顺序：内置基础 prompt -> 全局 globalDir/filename -> 目录链（仓库根 -> 当前目录）逐级合并，支持 @path 引入。
# 成本模型：项目层 AGENTS.md 是【每轮每次模型调用】都要重发的常驻预算，会挤占 compaction.threshold 额度、
# 并稀释模型对铁律的注意力。故推荐三层：L0 常驻（精简 AGENTS.md）/ L1 按需（docs/agents/*.md，
# 由模型自己 read_file，别用 @path 挂载——加载时 eager 展开等于没省）/ L2 条件化（下面两个开关 + 排除子树）。
# REPL 里 /memory 可逐层查看装配结果与估算 token；--no-project-memory 等价于把项目层关掉。
memory.instruction.enabled=true
memory.instruction.filename=AGENTS.md
memory.instruction.globalDir=~/.openagent
memory.instruction.maxImportDepth=5
# 项目层（目录链 AGENTS.md）独立开关：false 时保留全局层、只去掉项目层；子 agent 按类型另由代码决定
memory.instruction.project.enabled=true
# 排除子树：workspace 相对候选 AGENTS.md 所在目录落在这些路径片段内就跳过该层——命中的是
# “在本仓库的评测/产物目录里跑无关任务”的场景（如 eval/terminal-bench 下的任务工作区），
# 此时框架 internals 对任务纯属噪音。支持单级目录名或相对路径前缀，逗号分隔。
memory.instruction.project.exclude=eval,.agent-data,target

# ---- 文件会话存储（store.engine=FILE 时生效），每个 session 一个 {sessionId}.jsonl ----
store.file.dir=~/.openagent/sessions

# ---- L4 长期记忆（SQLite FTS5）----
# 总开关：关闭后记忆写入/检索/反思全部 no-op
memory.enabled=true
# SQLite 数据库文件路径（xerial 驱动内嵌原生库，无需本机安装 SQLite）
memory.sqlite.path=~/.openagent/memory.db
# FTS5 分词器：trigram 对中文友好（子串匹配）；也可换 unicode61/porter
memory.sqlite.fts.tokenizer=trigram
# 检索召回
memory.retrieval.enabled=true
memory.retrieval.topK=5
# 反思抽取：用一次 LLM 把对话蒸馏成长期记忆
memory.reflection.enabled=true
memory.reflection.maxInputChars=12000
# 反思触发时机（对标 Claude Code/Hermes，取代「每轮无条件蒸馏」）：
#   off           从不自动反思，完全依赖模型主动调 remember 工具（也关掉压缩抢救）
#   every_run     兼容旧行为，每个 run 结束都反思（最费）
#   on_compaction 仅当本 run 真的触发了上下文压缩时反思（信息即将被丢弃才沉淀，默认，推荐）
#   interval      每累计 N 个 turn 反思一次（对标 Hermes Periodic Nudge）
#   session_end   run 期间不反思，改由会话结束（退出/切换/--prompt 跑完）时统一蒸馏一次
# 另有独立的「压缩抢救」通道：只要 trigger 不是 off，本 run 发生压缩时，被裁掉/截断的原文
# 都会另跑一次异步蒸馏（run 末反思只能看到压缩后上下文，不抢救则摘要未保留的信息永久丢失）
memory.reflection.trigger=on_compaction
# interval 模式下每 N 个 turn 触发一次
memory.reflection.intervalTurns=5
# 反思在后台单线程异步执行（不阻塞 run 返回）；JVM 退出前等待在途任务排空的最长秒数
memory.reflection.shutdownTimeoutSeconds=30
# 写入去重：同分类同作用域的近似记忆更新而非新增，防止重复堆积
memory.dedup.enabled=true
# 去重相似度阈值 [0,1]，越大越严格（内容 bigram Jaccard + 标题/关键词加权）
memory.dedup.threshold=0.72
# 去重时拉取的候选条数
memory.dedup.candidates=8
# 记忆库容量上限，<=0 表示不限；超限按更新时间从旧到新淘汰
memory.capacity.max=1000
# 是否把 remember/recall/forget 暴露成模型可主动调用的工具
memory.tools.enabled=true

# model context window size (tokens)
model.context.window=200000

# ==================== P1 多模型 / 流式 / 文件工具 / 并行 ====================

# ---- 多模型支持（ModelFactory 装配，解除 DeepSeek 硬编码）----
# Chat Completions 链路 provider: deepseek / openai / ollama / vllm / lmstudio（后四者走 OpenAI 兼容协议）
model.provider=deepseek
# Responses API 链路 provider（仅 deepseek/openai 支持），缺省跟随 model.provider
#model.response.provider=deepseek
# 模型名（缺省：deepseek-chat / deepseek-v4-flash / gpt-4o / llama3.1）
#model.name=deepseek-chat
#model.response.name=deepseek-v4-flash
# 接入点与密钥：apiKey 未配置时回退环境变量 DEEPSEEK_API_KEY / OPENAI_API_KEY，本地服务免密钥
#model.deepseek.baseUrl=https://api.deepseek.com
#model.deepseek.apiKey=
#model.openai.baseUrl=https://api.openai.com/v1
#model.openai.apiKey=
#model.ollama.baseUrl=http://localhost:11434/v1

# ---- 流式输出（SSE token-by-token，长回答边生成边展示）----
model.stream.enabled=true
# 是否把思维链增量也打到 stderr（调试用，默认关闭避免刷屏）
model.stream.printReasoning=false

# ---- 文件工具（read_file / write_file / edit_file / repo_map）----
file.tools.enabled=true
# 写入是否允许工作区外路径（默认禁止，安全优先）
file.tools.allowOutside=false

# ---- 删除文件工具（delete_file，破坏性操作，工具层加硬限制）----
# 单独开关：关闭后不注册 delete_file（仍保留 read/write/edit），file.tools.enabled=false 会一并关掉
file.delete.enabled=true
# 硬限制（不可配）：路径必须在 repo root 之内（不受 file.tools.allowOutside 放开）、禁止删除目录。
# 下面是「敏感删除需人工确认」的可配旋钮：
# 确认总开关：关闭后任何删除都直接执行、不再问询（谨慎）
file.delete.confirm.enabled=true
# 命中这些后缀（.开头）或完整文件名（如 pom.xml/Dockerfile）需确认，逗号分隔
file.delete.confirm.suffixes=.java,pom.xml
# 文件字节数 >= 此值需确认；<=0 关闭大小规则
file.delete.confirm.minBytes=10240
# 豁免正则：命中即无需确认（优先于上面两条）。默认值内置在 DeleteFileTool，覆盖：
#   build/target/out/node_modules/.agent-data/test(s)/tmp 等目录、.tmp/.log/.bak/.class 等后缀、XxxTest.java 等测试文件。
# 如需自定义再取消注释（注意 properties 里反斜杠是转义符，正则的 \. 要写成 \\.）：
#file.delete.confirm.exempt.regex=(?:^|/)(?:test|tests|tmp|temp|target|build|out|node_modules|\\.agent-data)(?:/|$)|\\.(?:tmp|log|bak|swp|class|orig|rej)$|(?:Test|Tests|TestCase|Spec|IT)\\.(?:java|kt|scala)$
# 非交互环境（--prompt 一次性执行/单测，读不到 stdin）的兜底决策：true 放行 / false 拒绝（安全默认）
file.delete.confirm.autoApprove=false

# ---- 回溯到历史时刻（对标 Claude Code /rewind，com.szh.tool.store.FileSnapshotStore）----
# 开启后 write_file/edit_file 落盘前会拍 before-image 到 {workspace}/.agent-data/snapshots/{sessionId}/{turnId}/，
# REPL /rewind <N> 可把文件与对话上下文一并回退到第 N 轮之前。仅覆盖文件工具自身改动，
# 不含 shell/git/子 agent 的副作用（与 Claude Code checkpoint 边界一致，建议配合 git 版本控制使用）。
rewind.enabled=true

# ---- 并行工具调用（一轮内多个独立工具并发执行）----
# 并发度上限
agent.parallel.maxThreads=4
# 单轮并行执行总超时（秒），兜底防止单个工具挂死拖住整个 run
agent.parallel.timeoutSeconds=300

# ---- 工具能力探测按需注册（com.szh.tool.BinaryProbe）----
# 开启后 registry 在 rebuild 时对声明了 requiredBinaries 的工具（裸 git/mvn、git 工作流封装）按 PATH 探测，
# 本机缺对应命令则不注册，避免把不可用命令暴露给模型诱发无谓试错。关闭则一律注册（退回旧行为，供 PATH 不可靠环境/单测）。
tool.probe.binaries.enabled=true

# compaction: single threshold (ratio of context window)
# When exceeded: first try L0 rule-based compression, then escalate to L1 LLM summary if still over threshold
compaction.threshold=0.70

# compaction: keep recent N messages untouched
compaction.keep.recent=6

# ---- tool result budget: single source of truth shared by spill (ToolResultStore) & L0 truncation (StepCompactor) ----
# A tool result larger than tool.result.max.chars (or tool.result.max.lines) is spilled to a file under
# {project.workspace}/.agent-data/tool-results/{sessionId}/{callId}.txt; the context keeps only a stub with a
# head+tail preview + result_id, and the model reads the full content via read_tool_result (offset/limit pagination).
# StepCompactor's L0 truncation uses the SAME tool.result.max.chars, so anything it would truncate always has a
# file backup -> no silent data loss. Keep these two thresholds unified (do NOT reintroduce a separate smaller value).
tool.result.max.chars=4000
tool.result.max.lines=50
# max chars of the head+tail preview embedded in the spill stub (kept well below max.chars so the stub stays compact)
tool.result.preview.chars=1500

# ==================== P0 安全与可靠性 ====================

# ---- shell 安全总开关：关闭后权限层与沙箱全部旁路，退回宿主机直接执行 ----
shell.security.enabled=true

# ---- OS 级沙箱（对标 Codex：macOS 用 sandbox-exec/Seatbelt，其它平台降级为直连+权限层兜底）----
shell.sandbox.enabled=true
# 授权档位：read-only(只读) / workspace-write(可写工作区,默认禁网) / full-access(完全放开)
shell.sandbox.mode=workspace-write
# workspace-write 档位下额外允许写入的目录（构建缓存/临时目录），逗号分隔，支持 ~ 展开
shell.sandbox.writable.extra=~/.m2,~/.gradle,~/.openagent,/tmp,/private/tmp,/var/folders
# 联网豁免名单：workspace-write 默认禁网，仅这些可执行文件放开网络（常需拉远端依赖）
shell.sandbox.network.tools=git,mvn

# ---- 权限策略（对标 Claude Code allow/ask/deny）----
# 是否交互式确认；非交互场景（批处理/单测）设为 false 走 autoApprove
shell.permission.interactive=true
# 非交互或无人应答时的兜底决策：true 放行 / false 拒绝（安全默认）
shell.permission.autoApprove=false
# 危险命令(rm/dd/mkfs/git reset --hard 等)处理：deny / confirm / allow
shell.permission.dangerous=confirm
# 读取工作区外路径(路径穿越)处理：deny / confirm / allow
shell.permission.outsideRead=confirm

# ---- 模型调用重试与超时（对标主流：指数退避 + Retry-After）----
# 单次 HTTP 请求超时秒数
model.request.timeoutSeconds=120
# 最大尝试次数（含首次），<=1 表示不重试
model.retry.maxAttempts=3
model.retry.baseDelayMs=1000
model.retry.maxDelayMs=30000
model.retry.multiplier=2.0
model.retry.jitter=0.2

# ---- 循环护栏（分级刹车：先软提示纠偏，仍无效再硬熔断，避免无谓烧 token 与卡死）----
# 只统计「工具故障」（异常/超时/参数错误/工具不存在）；命令业务失败（exitCode!=0，如编译/测试没过）
# 是 coding agent 测试-修复循环的正常反馈，不计入连续故障，交给重复调用检测兜底。
agent.guard.enabled=true
# 全局连续故障达此值 -> 注入纠偏软提示，给模型改策略的机会（软档位，不终止）
agent.guard.adviseAfterFailures=3
# 全局连续故障达此值 -> 硬熔断，结束本次 run（须 > adviseAfterFailures）
agent.guard.maxConsecutiveFailures=5
# 单个工具连续故障达此值 -> 点名提示模型停用它、改用其他方法（每工具只提示一次）
agent.guard.advisePerToolAfter=2
# 单个工具连续故障达此值 -> 硬熔断（每条恢复路径独立上限，须 > advisePerToolAfter）
agent.guard.maxFailuresPerTool=4
# 同一工具+同一参数连续重复达此值 -> 判定死循环硬熔断（改代码后重跑相同命令属 fix-then-retry，已豁免）
agent.guard.maxRepeatCalls=4

# ==================== P2 交互 REPL / Git 工作流 / Trace 回放 ====================

# ---- 交互式 REPL（com.szh.cli.Repl，纯 JDK 无新增依赖）----
# 默认运行时链路：response(Responses API) / chat(Chat Completions)，会话内可 /runtime 切换
repl.runtime=response

# ---- Git 工作流工具（git_status/git_add/git_commit/git_push，结构化封装 add/commit/push）----
git.tools.enabled=true
# 仓库缺 user.name/user.email 会直接拒绝提交（“无法提交代码”常见诱因）；开启后用下面身份兜底注入。
# 注意：开启会以 -c 覆盖仓库既有身份，仅在确知本机未配置 git 身份时才打开
git.commit.autoIdentity=false
git.commit.userName=openagent
git.commit.email=openagent@localhost

# ---- Trace 回放（com.szh.trace.replay.TraceReplay）----
# HTML 可视化导出目录，落在 {trace.html.dir}/{sessionId}.html；缺省 {project.workspace}/.agent-data/traces
#trace.html.dir=

# ==================== P3 子 agent / Task 派生（上下文物理隔离）====================
# 主 agent 通过 dispatch_subagent(type, prompt) 把会产生大量中间产物的子任务外包给独立上下文的子 agent，
# 子 agent 用独立 AgentState/sessionId/工具白名单跑完，主 agent 只拿最终结论——长任务不炸上下文的核心手段。
# 总开关：关闭后不注册 dispatch_subagent 工具
subagent.enabled=true
# 最大派生深度：1 表示子 agent 不能再派生孙 agent（子 registry 不含 dispatch_subagent，从结构上杜绝无限递归）
subagent.maxDepth=1
# 子 agent 单次 run 的轮次上限（收紧于主 agent，控制成本与失控风险）
subagent.maxRound=30
# 子 agent 走哪条链路：chat(Chat Completions，兼容全部 provider) / response(Responses API，仅 deepseek/openai，不可用时自动回退 chat)
subagent.runtime=chat

# ==================== 元工具（agent 自组织：待办清单 / 结构化问询 / 模式切换）====================
# com.szh.tool.tools.meta：todo_write(自维护多步任务清单，落 TodoUpdatedEvent，REPL /todo 渲染)、
# ask_user_question(带候选项的结构化问询，读 stdin)、switch_mode(NORMAL/PLAN 切换，PLAN 下收敛为只读工具+规划指令)。
# 总开关：关闭后三件套都不注册，退回纯执行型 agent
meta.tools.enabled=true

# ==================== MCP Client（外部 MCP Server 工具生态）====================
# 总开关：关闭后不会读配置也不会拉起 Server 子进程
mcp.enabled=true
# Server 配置文件路径（格式对齐 Claude Desktop / Cursor），支持 ~ 展开
mcp.config.file=~/.openagent/mcp.json
# 单个 Server 启动 + initialize 握手超时（秒），超时归为启动失败
mcp.connect.timeoutSeconds=20
# 单次 RPC（tools/list、tools/call）超时（秒）；tools/call 内部还会受 agent.parallel.timeoutSeconds 兑底
mcp.rpc.timeoutSeconds=60

# ==================== 验证闭环（改动后强制跑编译/测试，不通过不许收尾）====================
# 对标 Aider auto-test / Claude Code Stop hook：模型宣布完成时，若本 run 改过代码，框架强制跑验证命令，
# 未通过则把失败输出回灌给模型逼其重修（最多 maxFixRounds 轮），通过才真正收尾。命令执行复用 shell 权限闸门+沙箱。
# 全局默认关闭；验证命令只能由项目级 {workspace}/.openagent/verify.json 或下面的全局配置文件声明（properties 不含命令）。
agent.verify.enabled=true
# 全局默认配置文件路径；项目级 {workspace}/.openagent/verify.json 优先
# verify.json 格式：{"enabled":true,"maxFixRounds":3,"timeoutSeconds":600,"commands":["mvn -q -DskipTests compile","mvn -q test"]}
agent.verify.config.file=~/.openagent/verify.json
# 验证-修复循环上限
agent.verify.maxFixRounds=3
# 单条验证命令超时（秒）
agent.verify.timeoutSeconds=600
# 仅当本 run 改过文件才验证（纯问答/只读任务跳过，不做无谓编译）
agent.verify.onlyWhenDirty=true

# ==================== 本地 Trace 查看器（Web Viewer，com.szh.web）====================
# 纯 JDK HttpServer + 原生 JS 单页，只读「事件日志 + 上下文快照」，不参与 agent 运行、零新增依赖。
# 启动：bin/openagent-web [--port 8787]；默认只绑 127.0.0.1、无鉴权，定位就是本机开发调试工具。
web.server.host=127.0.0.1
web.server.port=8787

# ---- 每轮上下文快照（侧车存储，与事件日志物理分离）----
# 「本轮究竟把什么发给了模型」在事件流里无法 100% 还原（system prompt 装配与运行期软装饰都不落事件），
# 故在 model.call 前把请求原样另存为快照：{trace.context.dir}/{sessionId}/{runId}.jsonl，一行一轮。
# 目录刻意设为全局（与 store.file.dir 同哲学）：若跟着工作区走，换个目录启动查看器就找不到快照。
# 关闭后 run 不写快照，查看器自动退化为「由事件流重建上下文」（近似结果，UI 会标注来源）。
trace.context.enabled=true
trace.context.dir=~/.openagent/context
# 单轮快照体积上限（字节）：超限跳过并告警，避免异常巨大的上下文撑爆读取方
trace.context.max.bytes=2097152