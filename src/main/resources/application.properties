# store engine: MYSQL(落库) / MEMORY(进程内非持久) / FILE(Codex 风格 JSONL rollout)
store.engine=MYSQL
project.workspace=/Users/demus/IdeaProjects/openagent-harness

# ---- 分层指令记忆（AGENTS.md 加载器，借鉴 Codex/Claude Code）----
# 启动时按 全局 globalDir/filename -> 仓库根 -> 当前目录 逐级合并装配进 system prompt，支持 @path 引入
memory.instruction.enabled=true
memory.instruction.filename=AGENTS.md
memory.instruction.globalDir=~/.openagent
memory.instruction.maxImportDepth=5

# ---- 文件会话存储（store.engine=FILE 时生效），每个 session 一个 {sessionId}.jsonl ----
store.file.dir=~/.openagent/sessions

# ---- L4 长期记忆（SQLite FTS5）----
# 总开关：关闭后记忆写入/检索/反思全部 no-op
memory.enabled=true
# SQLite 数据库文件路径（xerial 驱动内嵌原生库，无需本机安装 SQLite）
memory.sqlite.path=~/.openagent/memory.db
# FTS5 分词器：trigram 对中文友好（子串匹配）；也可换 unicode61/porter
memory.sqlite.fts.tokenizer=trigram
# 检索召回
memory.retrieval.enabled=true
memory.retrieval.topK=5
# 反思抽取：run 结束后用一次 LLM 把对话蒸馏成长期记忆
memory.reflection.enabled=true
memory.reflection.maxInputChars=12000
# 写入去重：同分类同作用域的近似记忆更新而非新增，防止重复堆积
memory.dedup.enabled=true
# 去重相似度阈值 [0,1]，越大越严格（内容 bigram Jaccard + 标题/关键词加权）
memory.dedup.threshold=0.72
# 去重时拉取的候选条数
memory.dedup.candidates=8
# 记忆库容量上限，<=0 表示不限；超限按更新时间从旧到新淘汰
memory.capacity.max=1000
# 是否把 remember/recall/forget 暴露成模型可主动调用的工具
memory.tools.enabled=true

# model context window size (tokens)
model.context.window=64000

# compaction: single threshold (ratio of context window)
# When exceeded: first try L0 rule-based compression, then escalate to L1 LLM summary if still over threshold
compaction.threshold=0.38

# compaction: keep recent N messages untouched
compaction.keep.recent=6

# ---- tool result budget: single source of truth shared by spill (ToolResultStore) & L0 truncation (StepCompactor) ----
# A tool result larger than tool.result.max.chars (or tool.result.max.lines) is spilled to a file under
# {project.workspace}/.agent-data/tool-results/{sessionId}/{callId}.txt; the context keeps only a stub with a
# head+tail preview + result_id, and the model reads the full content via read_tool_result (offset/limit pagination).
# StepCompactor's L0 truncation uses the SAME tool.result.max.chars, so anything it would truncate always has a
# file backup -> no silent data loss. Keep these two thresholds unified (do NOT reintroduce a separate smaller value).
tool.result.max.chars=4000
tool.result.max.lines=50
# max chars of the head+tail preview embedded in the spill stub (kept well below max.chars so the stub stays compact)
tool.result.preview.chars=1500

# ==================== P0 安全与可靠性 ====================

# ---- shell 安全总开关：关闭后权限层与沙箱全部旁路，退回宿主机直接执行 ----
shell.security.enabled=true

# ---- OS 级沙箱（对标 Codex：macOS 用 sandbox-exec/Seatbelt，其它平台降级为直连+权限层兜底）----
shell.sandbox.enabled=true
# 授权档位：read-only(只读) / workspace-write(可写工作区,默认禁网) / full-access(完全放开)
shell.sandbox.mode=workspace-write
# workspace-write 档位下额外允许写入的目录（构建缓存/临时目录），逗号分隔，支持 ~ 展开
shell.sandbox.writable.extra=~/.m2,~/.gradle,~/.openagent,/tmp,/private/tmp,/var/folders
# 联网豁免名单：workspace-write 默认禁网，仅这些可执行文件放开网络（常需拉远端依赖）
shell.sandbox.network.tools=git,mvn

# ---- 权限策略（对标 Claude Code allow/ask/deny）----
# 是否交互式确认；非交互场景（批处理/单测）设为 false 走 autoApprove
shell.permission.interactive=true
# 非交互或无人应答时的兜底决策：true 放行 / false 拒绝（安全默认）
shell.permission.autoApprove=false
# 危险命令(rm/dd/mkfs/git reset --hard 等)处理：deny / confirm / allow
shell.permission.dangerous=confirm
# 读取工作区外路径(路径穿越)处理：deny / confirm / allow
shell.permission.outsideRead=confirm

# ---- 模型调用重试与超时（对标主流：指数退避 + Retry-After）----
# 单次 HTTP 请求超时秒数
model.request.timeoutSeconds=120
# 最大尝试次数（含首次），<=1 表示不重试
model.retry.maxAttempts=3
model.retry.baseDelayMs=1000
model.retry.maxDelayMs=30000
model.retry.multiplier=2.0
model.retry.jitter=0.2

# ---- 循环熔断（连续失败/重复调用刹车，避免烧 token 与卡死）----
agent.guard.enabled=true
agent.guard.maxConsecutiveFailures=5
agent.guard.maxRepeatCalls=4