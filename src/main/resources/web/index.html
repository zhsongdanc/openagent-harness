<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenAgent Trace 查看器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
    <div class="brand">OpenAgent <span>Trace</span></div>
    <div class="topbar-meta" id="meta">加载中…</div>
    <div class="topbar-ops">
        <label class="switch"><input type="checkbox" id="autoRefresh" checked><span>自动刷新</span></label>
        <button type="button" id="btnExpand">全部展开</button>
        <button type="button" id="btnCollapse">全部折叠</button>
        <button type="button" id="btnReload">刷新</button>
    </div>
</header>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-head">
            <input type="search" id="sessionSearch" placeholder="搜索会话 / sessionId…">
        </div>
        <div class="sidebar-body" id="sessionList">
            <div class="empty">加载中…</div>
        </div>
        <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>

    <main class="main">
        <div class="main-head" id="sessionHead">
            <div class="hint">从左侧选择一个会话查看执行过程。</div>
        </div>
        <div class="toolbar">
            <input type="search" id="stepSearch" placeholder="在当前会话内过滤关键字（用户输入 / 工具名 / 正文）…">
            <span class="filter-tip" id="filterTip"></span>
        </div>
        <div class="legend">输入 prompt = 该轮送给模型的完整上下文（含 system prompt 与历史）· 输出 completion = 模型生成 ·
            合计 = 输入 + 输出 · 缓存 = 命中服务端 KV 缓存的输入 token · 「—」= 未记录（历史会话），数字 0 = 真的为 0</div>
        <div class="timeline" id="timeline">
            <div class="empty">暂无数据。</div>
        </div>
        <div class="raw-events">
            <details id="rawWrap">
                <summary>原始事件（调试用，点开按需拉取）</summary>
                <div class="raw-tools">
                    <label>起始 <input type="number" id="rawOffset" min="0" value="0" step="1"></label>
                    <label>条数 <input type="number" id="rawLimit" min="1" max="2000" value="100" step="1"></label>
                    <button type="button" id="btnRaw">加载</button>
                    <span class="filter-tip" id="rawTip"></span>
                </div>
                <pre class="raw-box" id="rawBox"></pre>
            </details>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
